services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: health_demo
      POSTGRES_USER: health_demo
      POSTGRES_PASSWORD: local-demo-only
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health_demo"]
      interval: 2s
      retries: 30
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      CLICKHOUSE_DB: health_demo
      CLICKHOUSE_USER: health_demo
      CLICKHOUSE_PASSWORD: local-demo-only
    ports: ["127.0.0.1:58123:8123"]
    volumes: ["clickhouse-data:/var/lib/clickhouse", "./sql/embeddings.xml:/etc/clickhouse-server/config.d/health-embeddings.xml:ro", "./sql/health-user.xml:/etc/clickhouse-server/users.d/z-health-user.xml:ro"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 2s
      retries: 30
volumes:
  postgres-data:
  clickhouse-data:
